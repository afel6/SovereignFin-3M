# Fast-fail signal, not a security boundary: on `pull_request` GitHub runs this file
# from the PR's merge commit, so a PR can edit it. The hard gate is code-owner review.
name: path-guard
on:
  pull_request:            # deliberately not pull_request_target; no checkout, no secrets
    branches: [main]       # no `paths:` filter: a skipped required workflow stays Pending
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: path-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  path-guard:
    name: path-guard       # unique job name = required status check name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Changed paths must stay inside the author's allowlist
        env:               # untrusted values via env, never inline ${{ }} in run:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          # --- guard start
          set -euo pipefail
          set -f                                   # no globbing of allowlist words
          LEAD="afel6"
          # GitHub logins are case-insensitive: keys below are lowercase and so is the author.
          # One line per contributor. Prefixes MUST end with "/".
          author="${AUTHOR,,}"
          case "$author" in
            "$LEAD")              exit 0 ;;
            tsaeedsaifullah-blip) allow="data_pipeline/clean/ database/tenk/" ;;
            moathkhaled2k5)       allow="rag_engine/contrib/" ;;
            9yavi)                allow="database/charts/" ;;
            mohammeddf503-beep)   allow="atlas_kv/contrib/" ;;
            tahaelsanfaz)         allow="frontend/" ;;
            ahmedkarrar742-afk)   allow="evaluation/safety/" ;;
            mdxflame23)           allow="evaluation/benchmark/ docs/presentation/" ;;
            *) echo "::error::No allowlist entry for this PR author; ask the lead."; exit 1 ;;
          esac
          if [ "${CHANGED:-0}" -ge 3000 ]; then    # files API returns at most 3000 files
            echo "::error::PR touches 3000+ files; split it."; exit 1
          fi
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
                    --jq '.[] | .filename, (.previous_filename // empty)')
          bad=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              .github/*|.claude/*|.cursor/*|.gemini/*) reason=protected ;;
              */.claude/*|*/.cursor/*|*/.gemini/*) reason=protected ;;   # nested agent config
              *) case "${f##*/}" in
                   CODEOWNERS|AGENTS.md|AGENTS.override.md|CLAUDE.md|CLAUDE.local.md|GEMINI.md|.cursorrules) reason=protected ;;
                   *) reason=outside ;;
                 esac ;;
            esac
            if [ "$reason" = outside ]; then
              for p in $allow; do
                case "$f" in "$p"*) reason=ok ;; esac
              done
            fi
            if [ "$reason" != ok ]; then
              printf 'BLOCKED (%s): %q\n' "$reason" "$f"   # %q + prefix: no workflow-command injection
              bad=1
            fi
          done <<< "$files"
          [ "$bad" = 0 ] || echo "::error::PR changes files outside the author's allowlist (see BLOCKED lines)."
          exit "$bad"
          # --- guard end
