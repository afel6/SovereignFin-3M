name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  UV_VERSION: "0.11.21"

jobs:
  lint-unit:
    name: lint-unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Secret scan (fails on committed key patterns; prints file names only)
        run: python .github/scripts/secret_scan.py
      - name: Path-guard self-test
        run: bash .github/tests/test_path_guard.sh
      - name: Gate (uv sync --locked --all-groups, ruff check, ruff format --check, pytest --cov)
        run: python scripts/gate.py

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.16
        env:
          POSTGRES_PASSWORD: ci-throwaway   # disposable service container, not a secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_ADMIN: postgresql://postgres:ci-throwaway@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Install dependencies
        run: uv sync --locked --all-groups
      # >>> Database rebuild and dataset validator commands go here (rebuild from init.sql,
      # >>> load the synthetic CSVs, run the validator). Leave this marker in place.
      # The dataset validator needs the downloaded 10-K file, so it runs locally (needs_data).
      - name: Generate synthetic CSVs and rebuild the test database
        env:
          SF_OWNER_PASSWORD: ci-owner-throwaway    # disposable service container, not a secret
          SF_READER_PASSWORD: ci-reader-throwaway  # disposable service container, not a secret
        run: |
          echo "SF_OWNER_PASSWORD=${SF_OWNER_PASSWORD}" >> "$GITHUB_ENV"
          echo "SF_READER_PASSWORD=${SF_READER_PASSWORD}" >> "$GITHUB_ENV"
          uv run --no-sync python -m data_pipeline.synth --out-dir data
          uv run --no-sync python -m database.rebuild --database sovereignfin_test
      - name: Integration tests
        run: uv run --no-sync pytest -m integration
